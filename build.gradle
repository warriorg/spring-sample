plugins {
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.10.6'
    id "com.diffplug.spotless" version "8.6.0"
    id 'java'
}

allprojects {

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://maven.aliyun.com/nexus/content/groups/public" }
        maven { url 'https://repo.spring.io/milestone' }
        maven { url 'https://repo.spring.io/snapshot' }
        maven {
            name = 'Central Portal Snapshots'
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    compileJava.options.encoding = 'UTF-8'
    group 'dev.warriorg'
    version '0.0.1'

    if (it.name == "platform") {
        return;
    }

    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'pmd'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: "io.spring.dependency-management"

    ext {
    }

    dependencies {
        api platform(project(':platform'))
        annotationProcessor platform(project(':platform'))
        testAnnotationProcessor platform(project(':platform'))

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        implementation 'org.mapstruct:mapstruct'
        annotationProcessor 'org.mapstruct:mapstruct-processor'

        testImplementation "org.springframework.boot:spring-boot-starter-test"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor("org.projectlombok:lombok")
        testAnnotationProcessor 'org.mapstruct:mapstruct-processor'

        implementation 'org.springframework.boot:spring-boot-starter'
    }

    clean{
        delete "bin", "out", ".settings", ".classpath", ".project"
    }

    tasks.named('test') {
        useJUnitPlatform()
    }



    pmd {
        consoleOutput = true
        rulesMinimumPriority = 5
        ruleSetFiles = files(rootProject.rootDir.getPath() + '/specification/pmd/ruleset.xml')
        ruleSets = []
    }

    spotless {
        java {
            removeUnusedImports()
            trimTrailingWhitespace()
            leadingTabsToSpaces(4)

            palantirJavaFormat()
            formatAnnotations()
        }
    }

    checkstyle {
        toolVersion = "10.12.4"
        config = rootProject.resources.text.fromFile("${rootProject.rootDir.getPath()}/specification/style/checkstyle.xml")
    }

}
