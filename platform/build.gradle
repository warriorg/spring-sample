plugins {
    id("java-platform")
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    api platform("org.springdoc:springdoc-openapi-bom:2.8.13")
    api platform("org.springframework.ai:spring-ai-bom:1.1.7")

    constraints {
        api("com.google.guava:guava:30.1-jre")
        api("org.apache.commons:commons-lang3:3.12.0")

        api("org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4")
        api("jakarta.validation:jakarta.validation-api:3.1.1")

        api('org.joda:joda-money:2.0.0')
        api("org.jadira.usertype:usertype.core:7.0.0.CR1")

        api 'com.mysql:mysql-connector-j:9.2.0'

        api 'org.wiremock.integrations:wiremock-spring-boot:3.9.0'

        api 'org.mapstruct:mapstruct:1.5.3.Final'
        api 'org.mapstruct:mapstruct-processor:1.5.3.Final'
    }
}